# Catch-all for TLS traffic addressed to hostnames this box does not serve.
#
# Place at: /etc/nginx/sites-available/00-default-tls
# Symlink:  ln -s /etc/nginx/sites-available/00-default-tls /etc/nginx/sites-enabled/
#
# Without an explicit default, nginx hands unknown-SNI connections to the
# FIRST server block listening on 443 — currently app-proxy, by include order.
# That meant strangers' domains pointed at this IP (e.g. www.fotokala.ee via
# Cloudflare) were answered with our certificate and proxied on to Vercel,
# which rejects them and fills app-bystrobarista.error.log with 502s.
#
# nginx 1.18 has no `ssl_reject_handshake`, so a certificate is still needed to
# finish the handshake before the connection is dropped. Any cert on the box
# works — it is never meant to validate for these names.
#
# Port 80 is deliberately left to the stock `default` site: certbot's webroot
# renewals rely on it.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/bystrobarista.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bystrobarista.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log off;

    # 444: close the connection without a response. Nothing to gain from
    # telling an unknown caller anything about this server.
    return 444;
}
