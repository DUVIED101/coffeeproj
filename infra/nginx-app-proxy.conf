# Russia-reachable proxy for the web app (app.bystrobarista.com).
#
# Place at: /etc/nginx/sites-available/app-proxy
# Symlink:  ln -s /etc/nginx/sites-available/app-proxy /etc/nginx/sites-enabled/
# Reload:   nginx -t && systemctl reload nginx
#
# Same shape and rationale as website-proxy (the marketing site) — read that
# file first. Differences here: this vhost fronts the authenticated Next.js
# app (Vercel project `bystrobarista-web`), so it also carries a body-size
# limit for form posts and a slightly longer read timeout for pages whose
# middleware makes two Supabase round trips.
#
# DNS prerequisite: app.bystrobarista.com A-record points at this VM
# (185.81.166.243), NOT at Vercel's edge. Vercel routes by Host header and the
# domain is attached to the project, so the right deployment is served.
#
# NOT proxied here: Supabase Realtime and REST, which the browser reaches
# directly at api.bystrobarista.com (see supabase-proxy) — that vhost owns the
# WebSocket upgrade handling.

server {
    listen 443 ssl http2;
    server_name app.bystrobarista.com;
    access_log /var/log/nginx/app-bystrobarista.access.log vercel_debug;
    error_log  /var/log/nginx/app-bystrobarista.error.log warn;

    # Declared per-server, not at http level: website-proxy already owns the
    # http-context resolver and a second one there would be a duplicate.
    resolver 1.1.1.1 8.8.8.8 valid=10s ipv6=off;
    resolver_timeout 5s;

    ssl_certificate     /etc/letsencrypt/live/app.bystrobarista.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.bystrobarista.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Profile photos and documents upload straight to Supabase Storage, so the
    # app itself only ever receives form posts — 10m is generous headroom.
    client_max_body_size 10m;

    set $vercel_upstream "cname.vercel-dns.com";

    location / {
        if ($bb_scanner_path) { return 444; }
        limit_req zone=app burst=80 nodelay;

        proxy_pass https://$vercel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 0;

        # POST is deliberately excluded (nginx default): an OAuth code exchange
        # or a message send must never be replayed against a second edge.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @vercel_retry;
    }

    location @vercel_retry {
        internal;
        set $vercel_retry_upstream "cname.vercel-dns.com";
        proxy_pass https://$vercel_retry_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 0;
    }

}

server {
    listen 80;
    server_name app.bystrobarista.com;
    access_log /var/log/nginx/app-bystrobarista.access.log vercel_debug;
    error_log  /var/log/nginx/app-bystrobarista.error.log warn;

    resolver 1.1.1.1 8.8.8.8 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $vercel_acme_upstream "cname.vercel-dns.com";

    # TWO ACME clients need this path and both must keep working:
    #   1. certbot on this box, for the cert nginx serves to users (webroot
    #      files land in /var/www/html and win here).
    #   2. Vercel, which needs its own cert for the same hostname so the
    #      nginx -> Vercel hop can complete its TLS handshake. Vercel answers
    #      the challenge from its edge, and plain HTTP is the only route that
    #      works before that cert exists — proxying over HTTPS would need the
    #      very certificate we are trying to obtain.
    # Without this passthrough the marketing site's trick does not apply: www
    # renews because Let's Encrypt follows the 301 into the already-working
    # TLS vhost, which a brand-new hostname does not have.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri @vercel_acme;
    }

    location @vercel_acme {

        proxy_pass http://$vercel_acme_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
