# __DOMAIN__ → self-hosted Supabase (Envoy gateway on 127.0.0.1:8000).
#
# Place at: /etc/nginx/sites-available/supabase-api
# Symlink:  ln -s /etc/nginx/sites-available/supabase-api /etc/nginx/sites-enabled/
# Needs:    /etc/nginx/conf.d/00-bystrobarista-tuning.conf (nginx-tuning.conf)
# Reload:   nginx -t && systemctl reload nginx
#
# Only the API prefixes are forwarded. Studio, pg-meta and the gateway's own
# dashboard routes stay on loopback: open them through an SSH tunnel
# (ssh -L 8000:127.0.0.1:8000 <host>, then http://localhost:8000).

upstream supabase_gateway {
    server 127.0.0.1:8000 max_fails=0;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    # Storage uploads: matches FILE_SIZE_LIMIT (10 MB) in docker-compose.yml.
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Realtime WebSocket (Phoenix Channels, 30 s heartbeat, long-lived).
    location ^~ /realtime/v1/ {
        proxy_pass http://supabase_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Edge functions: send-push fans out to APNs and can take a while.
    location ^~ /functions/v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://supabase_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Auth / REST / Storage / GraphQL.
    location ~ ^/(auth|rest|storage|graphql)/v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://supabase_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Everything else (Studio, /pg/, /api/, scanners): drop the connection.
    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name __DOMAIN__;

    # certbot webroot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
