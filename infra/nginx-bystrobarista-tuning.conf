# Drop this file at: /etc/nginx/conf.d/00-bystrobarista-tuning.conf
# It is included inside the http{} block automatically by Ubuntu's nginx.conf.
#
# Rate limiting — prevents a single client from exhausting upstream connections.
# 30r/s with burst=60 allows short bursts (e.g. app cold-start parallel requests)
# while blocking runaway clients (accidental infinite loops, misbehaving SDK).
#
# Zone: api = 10MB shared memory → ~160k unique IPs tracked.
# Applied in oracle-nginx-supabase-proxy.conf via `limit_req zone=api burst=60`.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# app.bystrobarista.com: a Next.js page load fans out into a few dozen asset
# requests, so the burst is generous; a scanner hammering hundreds of paths
# per minute is answered here instead of being forwarded to Vercel (whose
# edge blocked this IP for 15 min on 2026-09-06 after exactly that).
limit_req_zone $binary_remote_addr zone=app:10m rate=20r/s;

# Obvious vulnerability-scanner paths: closed without a reply and without a
# round trip to Vercel.
map $request_uri $bb_scanner_path {
    default 0;
    ~*^/(\.git|\.env|\.aws|\.ssh|wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc\.php|phpmyadmin|cgi-bin|vendor/phpunit|ecp/|owa/|autodiscover/|graphql|_ignition|actuator|solr/|console/|manager/html) 1;
    ~*\.(php|asp|aspx|jsp|cgi|sql|bak|env|ini)(\?|$) 1;
}
limit_req_status 429;

# Keep-alive tuning for long-lived Realtime WebSocket connections.
# Default keepalive_timeout is 75s — this is fine; leave it.
# Increase the number of in-flight connections each nginx worker handles.
# The actual cap is set per-worker in nginx.conf (worker_connections).


# Diagnostic log format for the Vercel-proxy path — captures which upstream
# edge IP served each request, connect/response times, and total request time.
# Used by /etc/nginx/sites-enabled/website-proxy access_log.
log_format vercel_debug '$remote_addr - $host "$request" '
                       '$status ups=$upstream_addr ups_status=$upstream_status '
                       'ups_ct=$upstream_connect_time ups_rt=$upstream_response_time '
                       'req_t=$request_time';
