# Drop this file at: /etc/nginx/conf.d/00-bystrobarista-tuning.conf
# It is included inside the http{} block automatically by Ubuntu's nginx.conf.
#
# Rate limiting — prevents a single client from exhausting upstream connections.
# 30r/s with burst=60 allows short bursts (e.g. app cold-start parallel requests)
# while blocking runaway clients (accidental infinite loops, misbehaving SDK).
#
# Zone: api = 10MB shared memory → ~160k unique IPs tracked.
# Applied in oracle-nginx-supabase-proxy.conf via `limit_req zone=api burst=60`.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# Keep-alive tuning for long-lived Realtime WebSocket connections.
# Default keepalive_timeout is 75s — this is fine; leave it.
# Increase the number of in-flight connections each nginx worker handles.
# The actual cap is set per-worker in nginx.conf (worker_connections).

